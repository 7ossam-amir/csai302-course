# Client authentication rules for the lab03 nodes ("who may connect, and how").
# TYPE     DATABASE  USER  ADDRESS  METHOD

# psql inside the container (docker exec) uses the local socket, not the network
local      all       all            trust

# over the network: only TLS connections, with a password
hostssl    all       all   all      scram-sha-256

# over the network without TLS: refused
hostnossl  all       all   all      reject
